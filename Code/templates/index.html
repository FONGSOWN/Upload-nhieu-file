<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UDM_10 — Upload nhiều file</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">↑</div>
        <div>
          <h1>UDM_10 Dashboard</h1>
          <p>Upload nhiều file · Flask Web App</p>
        </div>
      </div>
      <div class="top-meta">
        <span class="pill">localhost:5000</span>
        <span class="pill pill-dim">Dark mode</span>
      </div>
    </header>

    <section class="stats" aria-label="Thống kê">
      <article class="stat-card">
        <span class="stat-label">Đã chọn</span>
        <strong id="stat-count">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Tổng dung lượng</span>
        <strong id="stat-size">0 B</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Tiến trình</span>
        <strong id="stat-progress">0%</strong>
      </article>
    </section>

    <main class="panel">
      <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
        <label class="dropzone" id="dropzone" for="file-input">
          <input id="file-input" name="files" type="file" multiple hidden />
          <div class="drop-icon" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
              <path d="M12 16V7M12 7L8 11M12 7L16 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 16.5V18.2C4 19.746 5.254 21 6.8 21H17.2C18.746 21 20 19.746 20 18.2V16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <strong>Kéo thả file vào đây</strong>
          <span>hoặc bấm để chọn nhiều file cùng lúc</span>
        </label>

        <div class="toolbar">
          <button type="button" class="btn btn-ghost" id="btn-clear" disabled>Xóa danh sách</button>
          <button type="submit" class="btn btn-primary" id="btn-upload" disabled>Upload</button>
        </div>
      </form>

      <div class="overall" id="overall" hidden>
        <div class="overall-head">
          <span>Tổng tiến trình</span>
          <span id="overall-label">0%</span>
        </div>
        <div class="bar">
          <div class="bar-fill" id="overall-bar"></div>
        </div>
      </div>

      <div class="file-head">
        <h2>Danh sách file</h2>
        <span id="file-hint">Chưa chọn file nào</span>
      </div>
      <ul class="file-list" id="file-list"></ul>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
